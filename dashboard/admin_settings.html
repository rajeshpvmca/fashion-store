<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Settings - Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
        body { padding: 20px; background: #f8f9fa; font-family: sans-serif; }
        body * { font-style: normal !important; }
        .card { border: 1px solid #dee2e6; border-radius: 8px; }
    </style>
</head>
<body>
    <div >
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="h4 m-0">Store Settings</h2>
            <nav>
                <a href="admin_overview.html" class="btn btn-outline-dark btn-sm">Overview</a>
                <a href="admin_users.html" class="btn btn-outline-dark btn-sm">Users</a>
                <a href="admin_products.html" class="btn btn-outline-dark btn-sm">Products</a>
                <a href="admin_orders.html" class="btn btn-outline-dark btn-sm">Orders</a>
                <a href="admin_settings.html" class="btn btn-dark btn-sm">Settings</a>
            </nav>
        </div>

        <div class="row g-4">
            <div class="col-12 col-md-8">
                <div class="card p-4 bg-white h-100">
                    <h5 class="mb-4">General Settings</h5>
                    <form>
                        <div class="mb-3">
                            <label class="form-label">Store Name</label>
                            <input type="text" class="form-control" value="Beauty & Fashion Store">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Store Logo</label>
                            <input type="file" class="form-control">
                            <div class="form-text">Upload a PNG or JPG file. Max size 2MB.</div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Default Currency</label>
                            <select class="form-select">
                                <option value="USD" selected>USD ($)</option>
                                <option value="EUR">EUR (€)</option>
                                <option value="GBP">GBP (£)</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-dark">Save Changes</button>
                    </form>
                </div>
            </div>
            <div class="col-12 col-md-4">
                <div class="card p-4 bg-white h-100">
                    <h5 class="mb-4">Notifications</h5>
                    <form>
                        <div class="form-check form-switch mb-3">
                            <input class="form-check-input" type="checkbox" id="emailNotif" checked>
                            <label class="form-check-label" for="emailNotif">Email Notifications</label>
                        </div>
                        <div class="form-check form-switch mb-3">
                            <input class="form-check-input" type="checkbox" id="orderNotif" checked>
                            <label class="form-check-label" for="orderNotif">New Order Alerts</label>
                        </div>
                        <div class="form-check form-switch mb-3">
                            <input class="form-check-input" type="checkbox" id="stockNotif">
                            <label class="form-check-label" for="stockNotif">Low Stock Alerts</label>
                        </div>
                        <div class="form-check form-switch mb-3">
                            <input class="form-check-input" type="checkbox" id="smsNotif">
                            <label class="form-check-label" for="smsNotif">SMS Notifications</label>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
