<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Products - Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
        body { padding: 20px; background: #f8f9fa; font-family: sans-serif; }
        body * { font-style: normal !important; }
        .card { border: 1px solid #dee2e6; border-radius: 8px; }
        .product-img { width: 50px; height: 50px; object-fit: cover; border-radius: 4px; }
    </style>
</head>
<body>
    <div >
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="h4 m-0">Products Management</h2>
            <nav>
                <a href="admin_overview.html" class="btn btn-outline-dark btn-sm">Overview</a>
                <a href="admin_users.html" class="btn btn-outline-dark btn-sm">Users</a>
                <a href="admin_products.html" class="btn btn-dark btn-sm">Products</a>
                <a href="admin_orders.html" class="btn btn-outline-dark btn-sm">Orders</a>
                <a href="admin_settings.html" class="btn btn-outline-dark btn-sm">Settings</a>
            </nav>
        </div>

        <div class="card p-3 bg-white">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="m-0">Product Inventory</h5>
                <button class="btn btn-dark btn-sm">Add New Product</button>
            </div>
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead>
                        <tr>
                            <th>Product</th>
                            <th>Category</th>
                            <th>Price</th>
                            <th>Stock</th>
                            <th class="text-end">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>
                                <div class="d-flex align-items-center">
                                    <img src="../assets/images/sweaters.webp" alt="Sweater" class="product-img me-3">
                                    <span>Cozy Knit Sweater</span>
                                </div>
                            </td>
                            <td>Knitwear</td>
                            <td>$59.99</td>
                            <td>45</td>
                            <td class="text-end">
                                <button class="btn btn-sm btn-outline-dark"><i class="bi bi-pencil"></i></button>
                                <button class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
                            </td>
                        </tr>
                        <tr>
                            <td>
                                <div class="d-flex align-items-center">
                                    <img src="../assets/images/outerwear.webp" alt="Outerwear" class="product-img me-3">
                                    <span>Classic Trench Coat</span>
                                </div>
                            </td>
                            <td>Outerwear</td>
                            <td>$129.99</td>
                            <td>12</td>
                            <td class="text-end">
                                <button class="btn btn-sm btn-outline-dark"><i class="bi bi-pencil"></i></button>
                                <button class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
                            </td>
                        </tr>
                        <tr>
                            <td>
                                <div class="d-flex align-items-center">
                                    <img src="../assets/images/shoes.webp" alt="Shoes" class="product-img me-3">
                                    <span>Leather Ankle Boots</span>
                                </div>
                            </td>
                            <td>Footwear</td>
                            <td>$89.50</td>
                            <td><span class="text-danger">3</span></td>
                            <td class="text-end">
                                <button class="btn btn-sm btn-outline-dark"><i class="bi bi-pencil"></i></button>
                                <button class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
