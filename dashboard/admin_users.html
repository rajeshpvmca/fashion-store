<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Users - Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
        body { padding: 20px; background: #f8f9fa; font-family: sans-serif; }
        body * { font-style: normal !important; }
        .card { border: 1px solid #dee2e6; border-radius: 8px; }
    </style>
</head>
<body>
    <div>
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="h4 m-0">Users Management</h2>
            <nav>
                <a href="admin_overview.html" class="btn btn-outline-dark btn-sm">Overview</a>
                <a href="admin_users.html" class="btn btn-dark btn-sm">Users</a>
                <a href="admin_products.html" class="btn btn-outline-dark btn-sm">Products</a>
                <a href="admin_orders.html" class="btn btn-outline-dark btn-sm">Orders</a>
                <a href="admin_settings.html" class="btn btn-outline-dark btn-sm">Settings</a>
            </nav>
        </div>

        <div class="card p-3 bg-white">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="m-0">Customers list</h5>
                <button class="btn btn-dark btn-sm">Add New User</button>
            </div>
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Status</th>
                            <th>Role</th>
                            <th class="text-end">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>Alice Walker</td>
                            <td>alice@example.com</td>
                            <td><span class="badge bg-success">Active</span></td>
                            <td>Customer</td>
                            <td class="text-end">
                                <button class="btn btn-sm btn-outline-dark"><i class="bi bi-pencil"></i></button>
                                <button class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
                            </td>
                        </tr>
                        <tr>
                            <td>Bob Smith</td>
                            <td>bob@example.com</td>
                            <td><span class="badge bg-secondary">Inactive</span></td>
                            <td>Customer</td>
                            <td class="text-end">
                                <button class="btn btn-sm btn-outline-dark"><i class="bi bi-pencil"></i></button>
                                <button class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
                            </td>
                        </tr>
                        <tr>
                            <td>Charlie Brown</td>
                            <td>charlie@example.com</td>
                            <td><span class="badge bg-success">Active</span></td>
                            <td>Admin</td>
                            <td class="text-end">
                                <button class="btn btn-sm btn-outline-dark"><i class="bi bi-pencil"></i></button>
                                <button class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
<script>
document.addEventListener('DOMContentLoaded', () => {
    document.querySelectorAll('a, button').forEach(el => {
        if (!el.hasAttribute('data-bs-toggle') && !el.hasAttribute('data-bs-dismiss')) {
            el.addEventListener('click', (e) => {
                // Ignore empty links or links used purely for JS if they specifically want it,
                // but the user said "buttons click pana 404.html page than poganum".
                e.preventDefault();
                window.top.location.href = '../404.html';
            });
        }
    });
});
</script>
