<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Orders</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
        body { padding: 20px; background: #f8f9fa; font-family: sans-serif; }
        * { font-style: normal !important; }
        .card { border: 1px solid #dee2e6; border-radius: 8px; background-color: #fff; }
        .btn-dark { background-color: #000; color: #fff; border: none; }
        .btn-dark:hover { background-color: #333; }
        .btn-outline-dark { color: #000; border-color: #000; }
        .btn-outline-dark:hover { background-color: #000; color: #fff; }
    </style>
</head>
<body>
    <div class="" >
        <h2 class="mb-4">My Orders</h2>
        <div class="row g-4">
            <div class="col-12">
                <div class="card p-4">
                    <div class="d-flex flex-wrap justify-content-between align-items-center mb-2">
                        <h5 class="mb-0">Order #12345</h5>
                        <span class="badge bg-success">Delivered</span>
                    </div>
                    <p class="text-muted mb-2">Placed on October 12, 2023</p>
                    <p class="fw-bold mb-3">Total: $120.00</p>
                    <div>
                        <button class="btn btn-outline-dark btn-sm">View Details</button>
                    </div>
                </div>
            </div>
            <div class="col-12">
                <div class="card p-4">
                    <div class="d-flex flex-wrap justify-content-between align-items-center mb-2">
                        <h5 class="mb-0">Order #12346</h5>
                        <span class="badge bg-warning text-dark">Processing</span>
                    </div>
                    <p class="text-muted mb-2">Placed on October 15, 2023</p>
                    <p class="fw-bold mb-3">Total: $45.50</p>
                    <div>
                        <button class="btn btn-outline-dark btn-sm">View Details</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
