<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seller Overview</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <!-- Project CSS -->
    <link rel="stylesheet" href="../assets/css/style.css">
    <!-- ApexCharts -->
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <style>
        body { padding: 20px; background: #f8f9fa; font-family: sans-serif; }
        body * { font-style: normal !important; }
        .card { background-color: #fff; border: 1px solid #dee2e6; border-radius: 0.5rem; }
        .btn-dark { background-color: #000; border-color: #000; }
        .btn-dark:hover { background-color: #333; border-color: #333; }
    </style>
</head>
<body>
    <div >
        <h2 class="mb-4">Seller Overview</h2>
        <!-- Stat Cards -->
        <div class="row g-3 mb-4">
            <div class="col-md-4 col-sm-12">
                <div class="card p-3 shadow-sm h-100">
                    <h5 class="card-title text-muted">Total Earnings</h5>
                    <h3 class="card-text mb-0">$12,450.00</h3>
                </div>
            </div>
            <div class="col-md-4 col-sm-12">
                <div class="card p-3 shadow-sm h-100">
                    <h5 class="card-title text-muted">Active Products</h5>
                    <h3 class="card-text mb-0">45</h3>
                </div>
            </div>
            <div class="col-md-4 col-sm-12">
                <div class="card p-3 shadow-sm h-100">
                    <h5 class="card-title text-muted">Pending Orders</h5>
                    <h3 class="card-text mb-0">12</h3>
                </div>
            </div>
        </div>
        
        <!-- Charts -->
        <div class="row g-3">
            <div class="col-md-8 col-sm-12">
                <div class="card p-3 shadow-sm">
                    <h5 class="card-title">Sales Overview</h5>
                    <div id="salesChart"></div>
                </div>
            </div>
            <div class="col-md-4 col-sm-12">
                <div class="card p-3 shadow-sm text-center">
                    <h5 class="card-title">Target Completion</h5>
                    <div id="targetChart" class="d-flex justify-content-center"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Sales Area Chart
        var salesOptions = {
            series: [{
                name: 'Sales',
                data: [31, 40, 28, 51, 42, 109, 100]
            }],
            chart: {
                height: 350,
                type: 'area',
                toolbar: { show: false }
            },
            dataLabels: { enabled: false },
            stroke: { curve: 'smooth', colors: ['#000'] },
            fill: {
                type: 'gradient',
                gradient: {
                    shadeIntensity: 1,
                    opacityFrom: 0.7,
                    opacityTo: 0.9,
                    stops: [0, 90, 100],
                    colorStops: [
                        [
                            { offset: 0, color: '#000', opacity: 0.2 },
                            { offset: 100, color: '#000', opacity: 0 }
                        ]
                    ]
                }
            },
            xaxis: {
                categories: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun']
            }
        };

        var salesChart = new ApexCharts(document.querySelector("#salesChart"), salesOptions);
        salesChart.render();

        // Target Radial Bar Chart
        var targetOptions = {
            series: [75],
            chart: {
                height: 350,
                type: 'radialBar',
            },
            plotOptions: {
                radialBar: {
                    hollow: { size: '70%' },
                    dataLabels: {
                        show: true,
                        name: { show: false },
                        value: { show: true, fontSize: '30px', fontWeight: 'bold' }
                    }
                },
            },
            colors: ['#000'],
            labels: ['Completion'],
        };

        var targetChart = new ApexCharts(document.querySelector("#targetChart"), targetOptions);
        targetChart.render();
    </script>
</body>
</html>
