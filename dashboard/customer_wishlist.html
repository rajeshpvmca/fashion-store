<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Wishlist</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
        body { padding: 20px; background: #f8f9fa; font-family: sans-serif; }
        * { font-style: normal !important; }
        .card { border: 1px solid #dee2e6; border-radius: 8px; background-color: #fff; }
        .btn-dark { background-color: #000; color: #fff; border: none; }
        .btn-dark:hover { background-color: #333; }
        .card-img-top { object-fit: cover; height: 250px; background-color: #eee; border-top-left-radius: 8px; border-top-right-radius: 8px; }
    </style>
</head>
<body>
    <div >
        <h2 class="mb-4">My Wishlist</h2>
        <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-4">
            <div class="col">
                <div class="card h-100">
                    <img src="../assets/images/photo_05.webp" class="card-img-top" alt="Product Image">
                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title">Classic White T-Shirt</h5>
                        <p class="card-text fw-bold">$25.00</p>
                        <button class="btn btn-dark mt-auto w-100">Add to Cart</button>
                    </div>
                </div>
            </div>
            <div class="col">
                <div class="card h-100">
                    <img src="../assets/images/sweaters.webp" class="card-img-top" alt="Product Image">
                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title">Cozy Knit Sweater</h5>
                        <p class="card-text fw-bold">$55.00</p>
                        <button class="btn btn-dark mt-auto w-100">Add to Cart</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
