<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Settings</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
        body { padding: 20px; background: #f8f9fa; font-family: sans-serif; }
        * { font-style: normal !important; }
        .card { border: 1px solid #dee2e6; border-radius: 8px; background-color: #fff; }
        .btn-dark { background-color: #000; color: #fff; border: none; }
        .btn-dark:hover { background-color: #333; }
    </style>
</head>
<body>
    <div>
        <h2 class="mb-4">Account Settings</h2>
        <div class="card p-4">
            <form>
                <div class="mb-4">
                    <h5 class="mb-3 border-bottom pb-2">Profile Information</h5>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Full Name</label>
                        <input type="text" class="form-control" value="John Doe">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Email Address</label>
                        <input type="email" class="form-control" value="john.doe@example.com">
                    </div>
                </div>
                
                <div class="mb-4">
                    <h5 class="mb-3 border-bottom pb-2">Security</h5>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">New Password</label>
                        <input type="password" class="form-control" placeholder="Leave blank to keep current password">
                    </div>
                </div>
                
                <div class="mb-4">
                    <h5 class="mb-3 border-bottom pb-2">Preferences</h5>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="newsletterCheck" checked>
                        <label class="form-check-label text-muted" for="newsletterCheck">
                            Subscribe to newsletter for updates, promotions, and styling tips
                        </label>
                    </div>
                </div>
                
                <div class="mt-4 pt-2">
                    <button type="submit" class="btn btn-dark w-100 py-2 fw-semibold">Save Changes</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
