<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seller Products</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <!-- Project CSS -->
    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
        body { padding: 20px; background: #f8f9fa; font-family: sans-serif; }
        body * { font-style: normal !important; }
        .card { background-color: #fff; border: 1px solid #dee2e6; border-radius: 0.5rem; }
        .btn-dark { background-color: #000; border-color: #000; }
        .btn-dark:hover { background-color: #333; border-color: #333; }
        .product-img { width: 50px; height: 50px; object-fit: cover; border-radius: 4px; }
        .table-responsive { white-space: nowrap; }
    </style>
</head>
<body>
    <div >
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Inventory Management</h2>
            <button class="btn btn-dark"><i class="bi bi-plus-lg"></i> Add Product</button>
        </div>
        
        <div class="card p-3 shadow-sm">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>Product</th>
                            <th>Name</th>
                            <th>Price</th>
                            <th>Stock</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td><img src="../assets/images/outerwear.webp" alt="Product" class="product-img"></td>
                            <td>Winter Outerwear</td>
                            <td>$120.00</td>
                            <td><span class="badge bg-success">45 in stock</span></td>
                            <td>
                                <button class="btn btn-sm btn-outline-dark me-1"><i class="bi bi-pencil"></i></button>
                                <button class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
                            </td>
                        </tr>
                        <tr>
                            <td><img src="../assets/images/outerwear.webp" alt="Product" class="product-img"></td>
                            <td>Classic Denim Jacket</td>
                            <td>$85.00</td>
                            <td><span class="badge bg-warning text-dark">5 in stock</span></td>
                            <td>
                                <button class="btn btn-sm btn-outline-dark me-1"><i class="bi bi-pencil"></i></button>
                                <button class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
<script>
document.addEventListener('DOMContentLoaded', () => {
    document.querySelectorAll('a, button').forEach(el => {
        if (!el.hasAttribute('data-bs-toggle') && !el.hasAttribute('data-bs-dismiss')) {
            el.addEventListener('click', (e) => {
                // Ignore empty links or links used purely for JS if they specifically want it,
                // but the user said "buttons click pana 404.html page than poganum".
                e.preventDefault();
                window.top.location.href = '../404.html';
            });
        }
    });
});
</script>
