<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Page Not Found | Everlane</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- AOS Animation -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="./assets/css/style.css">
    <style>
        .error-title {
            font-size: 7.5rem;
            font-weight: 300;
            line-height: 1;
            font-style: normal !important;
            letter-spacing: -2px;
        }
        @media (max-width: 576px) {
            .error-title {
                font-size: 5rem;
            }
            .btn-404 {
                width: 100%;
            }
        }
    </style>
</head>
<body class="bg-white">
    
   

    <main>
        <!-- 404 Section -->
        <section class="position-relative d-flex align-items-center w-100 overflow-hidden" style="min-height: 100vh; background: url('./assets/images/error.webp') no-repeat center right / cover;" data-aos="fade-in">
            
            <!-- Gradient Overlay for Text Readability -->
            <div class="position-absolute top-0 start-0 w-100 h-100" style="background: linear-gradient(to right, rgba(245,242,238,1) 0%, rgba(245,242,238,0.95) 40%, rgba(245,242,238,0) 100%);"></div>
            
            <div class="container position-relative z-1">
                <div class="col-12 col-md-8 col-lg-6 text-start py-5">
                    <h1 class="error-title text-dark mb-3">404</h1>
                    <h2 class="fs-2 text-dark fw-normal mb-4 pb-2" style="font-style: normal !important;">Page Not Found</h2>
                    
                    <p class="fs-7 text-dark mb-5 lh-lg" style="font-style: normal !important; max-width: 350px;">
                        Looks like you've taken a wrong turn.<br>
                        Let's get you back to something good.
                    </p>
                    
                    <div class="d-flex flex-column flex-sm-row gap-3">
                        <a href="javascript:history.back()" class="btn btn-dark rounded-0 px-5 py-3 fs-8 fw-bold btn-404" style="font-style: normal !important; letter-spacing: 1px;">
                            <i class="bi bi-arrow-left me-2" style="font-style: normal !important; font-size: 1.1em; vertical-align: -0.1em;"></i> GO BACK
                        </a>
                        <a href="index.html" class="btn btn-outline-dark rounded-0 px-5 py-3 fs-8 fw-bold btn-404" style="font-style: normal !important; letter-spacing: 1px;">
                            <i class="bi bi-house-door me-2" style="font-style: normal !important; font-size: 1.1em; vertical-align: -0.1em;"></i> BACK TO HOME
                        </a>
                    </div>
                </div>
            </div>
        </section>
    </main>

    

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- AOS Animation -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <!-- Custom JS -->
    <script src="./assets/js/main.js"></script>
</body>
</html>
